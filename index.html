<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Content Security Policy allowing Mapbox WebWorkers, tile assets, APIs and Supabase in APK WebViews -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; worker-src * 'unsafe-inline' blob:; child-src * 'unsafe-inline' blob:; connect-src * https://*.tiles.mapbox.com https://api.mapbox.com https://events.mapbox.com https://*.supabase.co wss://*.supabase.co https://*.googleapis.com blob: data:; img-src * data: blob: https: http:; font-src * data: blob: https:; style-src * 'unsafe-inline' https:;" />
    <title>Heavy Metal Scene Platform</title>
    <meta name="description" content="Comprehensive portal, social feed, merch store, event manager, and music hub for heavy metal bands, promoters, creatives, and labels." />
    <meta property="og:title" content="Heavy Metal Scene Platform" />
    <meta property="og:description" content="Comprehensive portal, social feed, merch store, event manager, and music hub for heavy metal bands, promoters, creatives, and labels." />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0c0e12;
        color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #nexus-boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0c0e12;
        color: #00ffcc;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .nexus-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(0, 255, 204, 0.2);
        border-top-color: #00ffcc;
        border-radius: 50%;
        animation: nexus-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes nexus-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // 1. Stub Vite HMR WebSocket so dev client's createWebSocketModuleRunnerTransport never fails in iframe sandbox
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function ViteHmrStub(url, protocols) {
          var isHmr = false;
          try {
            if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1 || url.indexOf('token=') !== -1)) {
              isHmr = true;
            }
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            }
          } catch (_) {}

          if (isHmr) {
            var target = new EventTarget();
            var ws = {
              readyState: 1, // WebSocket.OPEN
              url: String(url),
              protocol: 'vite-hmr',
              bufferedAmount: 0,
              extensions: '',
              binaryType: 'blob',
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
              send: function() {},
              close: function(code, reason) {
                ws.readyState = 3;
                var ev = new CloseEvent('close', { code: code || 1000, reason: reason || 'Normal Closure', wasClean: true });
                target.dispatchEvent(ev);
                if (typeof ws.onclose === 'function') ws.onclose(ev);
              },
              addEventListener: function(type, listener, options) {
                target.addEventListener(type, listener, options);
              },
              removeEventListener: function(type, listener, options) {
                target.removeEventListener(type, listener, options);
              },
              dispatchEvent: function(event) {
                return target.dispatchEvent(event);
              }
            };
            setTimeout(function() {
              if (ws.readyState === 1) {
                var ev = new Event('open');
                target.dispatchEvent(ev);
                if (typeof ws.onopen === 'function') ws.onopen(ev);
              }
            }, 0);
            return ws;
          }
          return new NativeWebSocket(url, protocols);
        }
        ViteHmrStub.prototype = NativeWebSocket.prototype;
        ViteHmrStub.CONNECTING = 0;
        ViteHmrStub.OPEN = 1;
        ViteHmrStub.CLOSING = 2;
        ViteHmrStub.CLOSED = 3;
        window.WebSocket = ViteHmrStub;
      })();

      function isIgnorable(msg) {
        if (!msg) return false;
        var s = String(msg).toLowerCase();
        return s.indexOf('websocket') !== -1 ||
               s.indexOf('vite') !== -1 ||
               s.indexOf('hmr') !== -1 ||
               s.indexOf('createwebsocketmodulerunnertransport') !== -1 ||
               s.indexOf('resizeobserver') !== -1 ||
               s.indexOf('script error') !== -1;
      }
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || (e && e.error && e.error.message) || '';
        var file = (e && e.filename) || '';
        var stack = (e && e.error && e.error.stack) || '';
        if (isIgnorable(msg) || isIgnorable(file) || isIgnorable(stack)) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return;
        }
        showBootError(msg || 'Script initialization failed');
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reasonMsg = e && e.reason ? (e.reason.message || String(e.reason)) : 'Promise rejected';
        var reasonStack = (e && e.reason && e.reason.stack) || '';
        if (isIgnorable(reasonMsg) || isIgnorable(reasonStack)) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return;
        }
        var loader = document.getElementById('nexus-boot-loader');
        if (loader) {
          showBootError(reasonMsg);
        }
      }, true);
      function showBootError(msg) {
        if (isIgnorable(msg)) return;
        var root = document.getElementById('root');
        if (root && (!root.children.length || document.getElementById('nexus-boot-loader'))) {
          root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0c0e12;color:#ff3366;padding:24px;text-align:center;">' +
            '<h2 style="font-size:20px;margin-bottom:8px;">// NEXUS CORE BOOT NOTICE</h2>' +
            '<p style="color:#a1a1aa;max-width:400px;font-size:13px;margin-bottom:20px;">' + (msg || 'Unable to start application interface.') + '</p>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="background:#00ffcc;color:#000;border:none;padding:12px 24px;font-weight:bold;border-radius:8px;cursor:pointer;">Clear Cache & Reload</button>' +
            '</div>';
        }
      }
      setTimeout(function() {
        var loader = document.getElementById('nexus-boot-loader');
        if (loader && document.getElementById('root')) {
          console.warn('Nexus Core boot watchdog: loading took longer than expected.');
          showBootError('Initialization took longer than expected. Please reload or clear local cache.');
        }
      }, 8000);
    </script>
  </head>
  <body>
    <div id="root">
      <div id="nexus-boot-loader">
        <div class="nexus-spinner"></div>
        <div style="font-family: monospace; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;">Initializing Nexus Core...</div>
      </div>
    </div>
    
    <!-- Core App Initialization Script -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              if (reg && typeof reg.update === 'function') {
                reg.update().catch(() => {});
              }
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
